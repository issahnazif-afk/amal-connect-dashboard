services:
  - type: web
    name: amal-connect
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATA_DIR
        value: /var/data
      - key: JOB_SYNC_HOURS
        value: "6"
    disk:
      name: amal-data
      mountPath: /var/data
      sizeGB: 5
